services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drinkwatch
      POSTGRES_PASSWORD: drinkwatch
      POSTGRES_DB: drinkwatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drinkwatch -d drinkwatch"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8788:8000"
    volumes:
      # live source, so scrapers/scripts can be tweaked without rebuilding the image
      - ./app:/srv/app:ro
      - ./scripts:/srv/scripts:ro
      - ./migrations:/srv/migrations:ro
      # price-tag photos: point PHOTOS_HOST_DIR at the redmax backup disk
      - ${PHOTOS_HOST_DIR:-./photos}:/srv/photos
      # sideload APK served at /app/drinkwatch.apk
      - ./apk:/srv/apk:ro

volumes:
  pgdata:
